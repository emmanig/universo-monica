<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monica's Deep Space Universe</title>
    <style>
        /* Importando una fuente similar a la de la imagen */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif; /* Fuente tipo la imagen 1 */
            height: 100vh;
            width: 100vw;
            perspective: 1200px; 
            position: relative;
            cursor: crosshair;
        }

        /* --- NEBULOSAS --- */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -5;
            transition: all 12s ease-in-out;
            pointer-events: none;
        }
        .n1 { width: 600px; height: 600px; background: radial-gradient(circle, #6a0dad, transparent); }
        .n2 { width: 500px; height: 500px; background: radial-gradient(circle, #001f3f, transparent); }
        .n3 { width: 450px; height: 450px; background: radial-gradient(circle, #4b0082, transparent); }
        .n4 { width: 550px; height: 550px; background: radial-gradient(circle, #1e90ff, transparent); }
        .n5 { width: 400px; height: 400px; background: radial-gradient(circle, #8a2be2, transparent); }
        .n6 { width: 500px; height: 500px; background: radial-gradient(circle, #00008b, transparent); }

        .moon {
            position: absolute;
            top: 40px;
            right: 12%;
            width: 70px;
            height: 70px;
            background-color: transparent;
            border-radius: 50%;
            box-shadow: 12px 8px 0 0 #f0f0f0;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
            transform: rotate(-20deg);
            z-index: -4;
            pointer-events: none;
        }

        #stars-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -6;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.3); }
        }

        .container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            z-index: 10;
        }

        .floating-text {
            position: absolute;
            white-space: nowrap;
            color: #fff;
            font-weight: 900;
            letter-spacing: -1.5px; /* Estilo compacto como la imagen 1 */
            /* Efecto de resplandor suave de la imagen */
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(112, 214, 255, 0.4);
            will-change: transform;
            cursor: pointer;
            user-select: none;
            padding: 60px; 
            margin: -60px;
            pointer-events: auto;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            font-size: 35px;
            z-index: 9999;
            animation: explode 0.9s forwards ease-out;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div class="moon"></div>
    
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>
    <div class="nebula n4"></div>
    <div class="nebula n5"></div>
    <div class="nebula n6"></div>

    <div class="container" id="scene"></div>

    <script>
        const phrases = [
            { t: "I love you, my beautiful girl Monica 👧🏻💖", special: false },
            { t: "You are very special ✨💎", special: false },
            { t: "You are magnificent 🌟🤩", special: false },
            { t: "There is no one like you in the world 🌍🚫", special: false },
            { t: "You are everything I need 🫂💗", special: false },
            { t: "Will you marry me? 💍❓", special: true },
            { t: "Monica, my robloxina 🎮🎀", special: false },
            { t: "Monica, my little mouse 🐭🧀", special: false },
            { t: "Monica, I love you so much ♾️❤️", special: false }
        ];

        const scene = document.getElementById('scene');
        const starsContainer = document.getElementById('stars-container');
        const numTexts = 150; 
        const textsArray = [];

        function moveNebulas() {
            document.querySelectorAll('.nebula').forEach(neb => {
                const randomX = Math.random() * (window.innerWidth - 300);
                const randomY = Math.random() * (window.innerHeight - 300);
                neb.style.left = `${randomX}px`;
                neb.style.top = `${randomY}px`;
            });
        }
        moveNebulas();
        setInterval(moveNebulas, 10000);

        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = `${Math.random() * 2.5}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 4}s`);
            starsContainer.appendChild(star);
        }

        function createExplosion(x, y, isSpecial) {
            const icon = isSpecial ? '💍' : '❤️';
            for (let i = 0; i < 18; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerHTML = icon;
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                p.style.setProperty('--tx', `${(Math.random() - 0.5) * 500}px`);
                p.style.setProperty('--ty', `${(Math.random() - 0.5) * 500}px`);
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 900);
            }
        }

        function createText(initial = false) {
            const textEl = document.createElement('div');
            textEl.className = 'floating-text';
            const choice = phrases[Math.floor(Math.random() * phrases.length)];
            textEl.textContent = choice.t;
            scene.appendChild(textEl);

            const data = {
                el: textEl,
                isSpecial: choice.special,
                x: (Math.random() - 0.5) * window.innerWidth * 3,
                y: initial ? (Math.random() * window.innerHeight * 3 - window.innerHeight) : -1000,
                z: Math.random() * 1500 - 1200, 
                size: Math.floor(Math.random() * (45 - 20) + 20),
                active: true
            };

            textEl.addEventListener('mousedown', (e) => {
                if(!data.active) return;
                data.active = false;
                createExplosion(e.clientX, e.clientY, data.isSpecial);
                textEl.style.visibility = 'hidden';
                setTimeout(() => {
                    data.y = -1000;
                    data.x = (Math.random() - 0.5) * window.innerWidth * 3;
                    data.z = Math.random() * 1500 - 1200;
                    data.active = true;
                    textEl.style.visibility = 'visible';
                }, 1500);
            });

            return data;
        }

        for (let i = 0; i < numTexts; i++) {
            textsArray.push(createText(true));
        }

        function animate() {
            textsArray.forEach(t => {
                if (!t.active) return;
                let speed = 1.2 + ((t.z + 1200) / 1500) * 6;
                t.y += speed;

                if (t.y > window.innerHeight + 800) {
                    t.y = -1000;
                    t.x = (Math.random() - 0.5) * window.innerWidth * 3;
                    t.z = Math.random() * 1500 - 1200;
                }

                let opacity = 0.3 + ((t.z + 1200) / 1500) * 0.7;
                let blur = t.z < -600 ? Math.abs(t.z + 600) / 100 : 0;
                
                t.el.style.fontSize = t.size + "px";
                t.el.style.opacity = opacity;
                t.el.style.filter = `blur(${blur}px)`;
                t.el.style.transform = `translate3d(${t.x}px, ${t.y}px, ${t.z}px)`;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
